name: Resolve M3U redirects

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes, offset from the top of the hour.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: resolve-m3u-redirects
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Check out playlist repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependency
        run: python -m pip install requests

      - name: Resolve redirect URLs
        run: python scripts/resolve_redirects.py

      - name: Commit updated playlist
        run: |
          if git diff --quiet -- playlist.m3u; then
            echo "No playlist changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Automatically resolve M3U redirects"
          git push
          
