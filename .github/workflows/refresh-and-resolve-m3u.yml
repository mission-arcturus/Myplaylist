name: Refresh and resolve M3U redirects

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-and-resolve-m3u
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Preserve the original playlist on first run
        run: |
          set -e
          if [ ! -s playlist-source.m3u ]; then
            curl --fail --location --silent --show-error \
              "https://raw.githubusercontent.com/mission-arcturus/Myplaylist/refs/heads/main/playlist.m3u" \
              --output playlist-source.m3u
          fi
          test -s playlist-source.m3u
          grep -q '^#EXTM3U' playlist-source.m3u
          cp playlist-source.m3u playlist.m3u

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: python -m pip install requests

      - name: Resolve redirect.php links
        run: python scripts/resolve_redirects.py

      - name: Commit updated playlist and preserved source
        run: |
          if git diff --quiet -- playlist.m3u playlist-source.m3u; then
            echo "No playlist changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlist-source.m3u
          git commit -m "Refresh playlist and resolve redirect URLs"
          git push
